version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-Booking_DB_Docker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  monolith:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-Booking_DB_Docker}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      NOTIFICATION_SERVICE_URL: http://notification_service:8001
      PAYMENT_SERVICE_URL: http://payment_service:8002
      MONOLITH_URL: http://localhost:8000
      INTERNAL_SERVICE_TOKEN: internal-service-token
    restart: unless-stopped

  notification_service:
    build: .
    command: uvicorn notification_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USE_TLS: false
      SMTP_FROM_EMAIL: noreply@booking.local
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A notification_service.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USE_TLS: false
      SMTP_FROM_EMAIL: noreply@booking.local
    restart: unless-stopped

  payment_service:
    build: .
    command: uvicorn payment_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    depends_on:
      notification_service:
        condition: service_started
      monolith:
        condition: service_started
    environment:
      MONOLITH_URL: http://monolith:8000
      NOTIFICATION_SERVICE_URL: http://notification_service:8001
      INTERNAL_SERVICE_TOKEN: internal-service-token
    restart: unless-stopped

volumes:
  postgres_data:
